name: setup-godot
description: Godot 4.7 の Linux バイナリと export templates (指定したものだけ) を用意し、キャッシュする

# release / version_dir の既定値は project.godot の config/features ("4.7") と ADR 0001 の Godot 4.7 stable に合わせる
inputs:
  release:
    description: "Godot のリリース名 (GitHub Releases のタグ)"
    required: false
    default: "4.7-stable"
  version_dir:
    description: "export_templates 配下のバージョンディレクトリ名"
    required: false
    default: "4.7.stable"
  templates:
    description: "tpz から取り出す templates/ 配下のファイル (空白区切り。version.txt は常に取り出す)"
    required: true
  cache_key_suffix:
    description: "取り出すテンプレートの組み合わせを表すキャッシュキーの接尾辞"
    required: true

outputs:
  godot:
    description: "Godot 実行ファイルの絶対パス"
    value: ${{ steps.path.outputs.godot }}

runs:
  using: composite
  steps:
    - name: Cache Godot binary and export templates
      id: cache-godot
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/godot-bin
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.release }}-${{ inputs.version_dir }}-${{ inputs.cache_key_suffix }}
    - name: Install Godot and export templates
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_RELEASE: ${{ inputs.release }}
        GODOT_VERSION_DIR: ${{ inputs.version_dir }}
        TEMPLATES: ${{ inputs.templates }}
      run: |
        mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION_DIR}
        curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot-bin
        curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
        # TEMPLATES は空白区切りの複数ファイルを渡すため意図的に単語分割する
        # shellcheck disable=SC2086
        unzip -q -o -j /tmp/templates.tpz "templates/version.txt" $TEMPLATES \
          -d ~/.local/share/godot/export_templates/${GODOT_VERSION_DIR}
    - name: Resolve Godot path
      id: path
      shell: bash
      env:
        GODOT_RELEASE: ${{ inputs.release }}
      run: echo "godot=$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_OUTPUT"
